<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS2 Home Panel</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="auth" hidden></div>

    <div id="app" hidden>
      <aside class="sidebar">
        <a class="brand" href="#/">
          <img src="/img/logo.svg" alt="" />
          <div><b>CS2 Home Panel</b><small>Serveur hébergé sur ce PC</small></div>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="side-status" id="side-status"></div>
        <div class="side-foot">
          <span>v1.0</span>
          <button class="btn btn-ghost btn-sm" id="logout" title="Se déconnecter"></button>
        </div>
      </aside>

      <main>
        <div class="jobbar" id="jobbar" hidden></div>
        <div class="view" id="view"></div>
      </main>
    </div>

    <div class="offline" id="offline" hidden><span class="chip err">Connexion au panel perdue… reconnexion</span></div>
    <div id="toasts"></div>
    <div id="modal-root"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
